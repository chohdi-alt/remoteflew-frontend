<div class="password-page">
  <form class="password-card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <h1>Change Password</h1>
    <p class="subtitle">Set a new password to activate your account.</p>

    <label>
      <span>Username</span>
      <input type="text" formControlName="username" readonly />
    </label>

    <label>
      <span>Temporary password</span>
      <input type="password" formControlName="temporaryPassword" autocomplete="current-password" />
    </label>

    <label>
      <span>New password</span>
      <input type="password" formControlName="newPassword" autocomplete="new-password" />
      @if (form.controls.newPassword.touched && form.controls.newPassword.hasError('minlength')) {
        <small class="hint">Password must contain at least 8 characters.</small>
      }
    </label>

    <label>
      <span>Confirm new password</span>
      <input type="password" formControlName="confirmPassword" autocomplete="new-password" />
    </label>

    @if (hasPasswordMismatch) {
      <p class="error">New password and confirmation do not match.</p>
    }

    @if (errorMessage) {
      <p class="error">{{ errorMessage }}</p>
    }

    <button type="submit" [disabled]="isSubmitting || form.invalid">
      {{ isSubmitting ? 'Updating password...' : 'Update password' }}
    </button>
  </form>
</div>
