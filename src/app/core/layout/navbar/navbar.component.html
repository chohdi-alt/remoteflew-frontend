@if (isAuthenticated()) {
  @if ((showEmployeeMobileNav$ | async) === true) {
    <nav class="mobile-nav" aria-label="Employee mobile navigation">
      <button type="button" class="hamburger" (click)="toggleDrawer()" aria-label="Open navigation menu">&#9776;</button>
      <button type="button" class="mobile-brand" (click)="navigateToDashboard()">RemoteFlow</button>
    </nav>

    <div class="drawer-overlay" *ngIf="isDrawerOpen" (click)="closeDrawer()">
      <aside class="sidenav" [class.open]="isDrawerOpen" (click)="$event.stopPropagation()">
        <button type="button" class="sidenav__logo" (click)="navigateToDashboard(); closeDrawer()">RemoteFlow</button>
        <div class="sidenav__links">
          <button
            type="button"
            class="sidenav__item"
            routerLink="/employee/dashboard"
            routerLinkActive="sidenav__item--active"
            (click)="closeDrawer()">
            Dashboard
          </button>
          <button
            type="button"
            class="sidenav__item"
            routerLink="/employee/requests"
            routerLinkActive="sidenav__item--active"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="closeDrawer()">
            Requests
          </button>
          <button
            type="button"
            class="sidenav__item"
            routerLink="/employee/requests/history"
            routerLinkActive="sidenav__item--active"
            (click)="closeDrawer()">
            History
          </button>
          <button type="button" class="sidenav__item sidenav__item--logout" (click)="logout()">
            Logout
          </button>
        </div>
      </aside>
    </div>
  } @else {
    <nav class="navbar" aria-label="Primary navigation">
      <button type="button" class="logo" (click)="navigateToDashboard()">RemoteFlow</button>
      <div class="links">
        <button type="button" class="link" (click)="navigateToDashboard()">Dashboard</button>
        @if (isAdmin()) {
          <button type="button" class="link" routerLink="/admin/users" routerLinkActive="link--active">Users</button>
          <button type="button" class="link" routerLink="/admin/teams" routerLinkActive="link--active">Teams</button>
          <button type="button" class="link" routerLink="/admin/smtp" routerLinkActive="link--active">SMTP</button>
          <button type="button" class="link" routerLink="/admin/archives" routerLinkActive="link--active">Archives</button>
        }
        @if (isEmployee()) {
          <button type="button" class="link" routerLink="/employee/requests" routerLinkActive="link--active">Requests</button>
        }
        @if (isManager()) {
          <button type="button" class="link" routerLink="/manager/requests" routerLinkActive="link--active">Manager Requests</button>
          <button type="button" class="link" routerLink="/manager/scoring" routerLinkActive="link--active">Manager Scoring</button>
        }
        @if (isHr()) {
          <button type="button" class="link" routerLink="/hr/requests" routerLinkActive="link--active">HR Requests</button>
          <button type="button" class="link" routerLink="/hr/scoring-audit" routerLinkActive="link--active">Scoring Audit</button>
        }
        <button type="button" class="link" (click)="navigateToProfile()">Profile</button>
        <button type="button" class="logout" (click)="logout()">Logout</button>
      </div>
    </nav>
  }
}
