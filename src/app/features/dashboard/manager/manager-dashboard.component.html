<ng-container *ngIf="(isHandset$ | async) === true">
  <header class="manager-mobile-header">
    <button type="button" class="manager-mobile-header__menu" (click)="toggleDrawer()" aria-label="Open manager navigation">
      &#9776;
    </button>
    <h2>Manager Dashboard</h2>
  </header>

  <div class="manager-nav-overlay" *ngIf="isDrawerOpen" (click)="closeDrawer()">
    <aside class="manager-sidenav open" (click)="$event.stopPropagation()">
      <button type="button" class="manager-sidenav__brand" routerLink="/manager/dashboard" (click)="closeDrawer()">RemoteFlow</button>
      <button type="button" class="manager-sidenav__item" routerLink="/manager/dashboard" (click)="closeDrawer()">Dashboard</button>
      <button type="button" class="manager-sidenav__item" routerLink="/manager/requests" (click)="closeDrawer()">Requests</button>
      <button type="button" class="manager-sidenav__item" routerLink="/manager/scoring" (click)="closeDrawer()">Scoring</button>
      <button type="button" class="manager-sidenav__item" routerLink="/manager/inbox" (click)="closeDrawer()">Inbox</button>
      <button type="button" class="manager-sidenav__item manager-sidenav__item--logout" (click)="logout()">Logout</button>
    </aside>
  </div>
</ng-container>

<app-dashboard-layout
  title="Manager Dashboard"
  subtitle="Team approvals and manager decision velocity. Note: Averages and pending counts are calculated on full dataset and are not date-filtered.">
  <section class="filter-row">
    <mat-form-field appearance="outline">
      <mat-label>From</mat-label>
      <input matInput type="date" [formControl]="fromControl" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>To</mat-label>
      <input matInput type="date" [formControl]="toControl" />
    </mat-form-field>

    <button mat-stroked-button type="button" (click)="clearFilters()">Clear</button>
  </section>

  @if (dateRangeError$ | async; as error) {
    <p class="filter-error">{{ error }}</p>
  }

  @if (dashboardData$ | async; as vm) {
    @if (vm.showPendingWarning) {
      <p class="pending-warning" title="Pending task count may be unavailable.">
        <span class="pending-warning-icon" aria-hidden="true">⚠</span>
        Pending task count may be unavailable.
      </p>
    }

    <section class="kpi-grid">
      <app-kpi-card
        title="Pending Manager Tasks"
        icon="pending_actions"
        color="warning"
        [value]="vm.raw.pendingManagerTasks">
      </app-kpi-card>
      <app-kpi-card
        title="Avg Manager Decision Time"
        icon="schedule"
        color="neutral"
        [value]="vm.avgDecisionTimeText">
      </app-kpi-card>
      <app-kpi-card
        title="Submitted"
        icon="description"
        color="primary"
        [value]="vm.raw.teamTotalsByStatus.SUBMITTED">
      </app-kpi-card>
      <app-kpi-card
        title="Approved"
        icon="check_circle"
        color="success"
        [value]="vm.raw.teamTotalsByStatus.APPROVED">
      </app-kpi-card>
    </section>

    <section class="chart-grid">
      <app-base-chart
        title="Team Status Distribution"
        [chartType]="vm.totalsPie.type"
        [categories]="vm.totalsPie.categories"
        [series]="vm.totalsPie.series">
      </app-base-chart>

      <app-base-chart
        title="Team Monthly Trend"
        [chartType]="vm.monthlyLine.type"
        [categories]="vm.monthlyLine.categories"
        [series]="vm.monthlyLine.series">
      </app-base-chart>
    </section>
  }
</app-dashboard-layout>
