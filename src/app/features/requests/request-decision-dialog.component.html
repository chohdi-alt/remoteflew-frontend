<h2 mat-dialog-title>{{ data.role }} Decision</h2>

<mat-dialog-content>
  <p class="context">
    Request #{{ data.request.requestId ?? '--' }} for {{ data.request.employeeName }}
    ({{ data.request.startDate ? (data.request.startDate | date:'mediumDate') : '--' }} to
    {{ data.request.endDate ? (data.request.endDate | date:'mediumDate') : '--' }}).
  </p>

  <mat-form-field appearance="outline" class="comment-field">
    <mat-label>Comment (optional)</mat-label>
    <textarea matInput [formControl]="form.controls.comment" rows="4" maxlength="500"></textarea>
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancel</button>
  <button mat-stroked-button type="button" color="warn" (click)="reject()">Reject</button>
  <button mat-flat-button type="button" color="primary" (click)="approve()">Approve</button>
</mat-dialog-actions>
